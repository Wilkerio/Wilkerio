<svg width="620" height="316" viewBox="0 0 620 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartão de status estilo terminal">
  <style>
    .row { opacity: 0; animation: slidein 0.4s ease-out forwards; }
    @keyframes slidein { 0% { opacity: 0; transform: translateX(-14px); } 100% { opacity: 1; transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } }
    .prompt { font: 600 13px "Cascadia Code","Fira Code",monospace; fill: #BB9354; }
    .key { font: 400 13px "Cascadia Code","Fira Code",monospace; fill: #6e7681; }
    .val { font: 600 13px "Cascadia Code","Fira Code",monospace; fill: #c9d1d9; }
    .cursor { fill: #BB9354; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="100%" height="100%" fill="#0d1117" rx="8"/>
  <rect x="0.5" y="0.5" width="619" height="315" rx="8" fill="none" stroke="#7a6138"/>
  <text x="24" y="20" class="prompt">wilkerio@dev:~$ whoami --verbose</text>
  <g class="row" style="animation-delay:0.00s"><text x="24" y="34" class="key">usuario</text><text x="200" y="34" class="val">Wilkerio</text></g>
<g class="row" style="animation-delay:0.10s"><text x="24" y="58" class="key">linguagens</text><text x="200" y="58" class="val">TypeScript · JavaScript · Python</text></g>
<g class="row" style="animation-delay:0.20s"><text x="24" y="82" class="key">frontend</text><text x="200" y="82" class="val">React · Vite · Tailwind</text></g>
<g class="row" style="animation-delay:0.30s"><text x="24" y="106" class="key">backend/dados</text><text x="200" y="106" class="val">Node.js · Supabase · PostgreSQL</text></g>
<g class="row" style="animation-delay:0.40s"><text x="24" y="130" class="key">mobile</text><text x="200" y="130" class="val">React Native / Expo</text></g>
<g class="row" style="animation-delay:0.50s"><text x="24" y="154" class="key">infra</text><text x="200" y="154" class="val">Docker · GitHub Actions</text></g>
<g class="row" style="animation-delay:0.60s"><text x="24" y="178" class="key">seguranca</text><text x="200" y="178" class="val">SAST, secret scan, pentest com IA</text></g>
<g class="row" style="animation-delay:0.70s"><text x="24" y="202" class="key">repos publicos</text><text x="200" y="202" class="val">11</text></g>
