name: update readme art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate-readme-art.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: gerar SVGs (sem token, so endpoints publicos)
        run: node scripts/generate-readme-art.mjs
      - name: commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add heatmap.svg neofetch.svg header.svg
          git diff --cached --quiet || git commit -m "chore: atualizar arte do README [skip ci]"
          git push
